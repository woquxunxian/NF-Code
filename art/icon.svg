<!--
  Product icon: Lucide's "sparkles" mark on a rounded square plate.

  The sparkle path comes from the lucide package (node_modules/lucide, exported as
  Sparkles) and its center is (12,12) in its own coordinates, the dot's center is (4,20).
  Each mark is a plain group transformed with "translate then scale", so the centering is
  simply "target position minus center times scale".

  Regenerate every platform icon (ico, icns, appx tiles, installer sidebar, favicon)
  from this file with:
    node scripts/generate-icons.cjs
-->
<svg height="1024" width="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Sparkles">
   <defs>
      <linearGradient id="plate" x1="0" y1="0" x2="0" y2="1">
         <stop offset="0" stop-color="#ff6b6b"/>
         <stop offset="1" stop-color="#ff4c4c"/>
      </linearGradient>
   </defs>
   <rect x="0" y="0" width="1024" height="1024" rx="224" ry="224" fill="url(#plate)"/>
   <!-- main sparkle: 20 units at 32x = 640px, centered at (512,512) -->
   <g fill="#ffffff" transform="translate(128,128) scale(32)">
      <path d="M11.017 2.814a1 1 0 0 1 1.966 0l1.051 5.558a2 2 0 0 0 1.594 1.594l5.558 1.051a1 1 0 0 1 0 1.966l-5.558 1.051a2 2 0 0 0-1.594 1.594l-1.051 5.558a1 1 0 0 1-1.966 0l-1.051-5.558a2 2 0 0 0-1.594-1.594l-5.558-1.051a1 1 0 0 1 0-1.966l5.558-1.051a2 2 0 0 0 1.594-1.594z"/>
   </g>
   <!-- small dot: 4 units at 12x = 48px, sitting inside the plate at (260,764) -->
   <g fill="#ffffff" transform="translate(212,524) scale(12)">
      <circle cx="4" cy="20" r="2"/>
   </g>
</svg>
